params:
  - id: zerotier_network_id
    type: string
    name: "ZeroTier Network ID"
    description: "ZeroTier network ID to join (e.g., a1b2c3d4e5f6g7h8)"
    optional: false

  - id: tz
    type: string
    name: "Timezone"
    description: "Container timezone"
    default_value: "Etc/UTC"
    optional: true

  - id: zerotier_local_phys
    type: string
    name: "Local Physical Interface"
    description: "Local physical network interface for ZeroTier"
    default_value: "enp2s0"
    optional: true

  - id: zerotier_use_iptables_nft
    type: bool
    name: "Use iptables nft"
    description: "Use iptables nft backend instead of legacy"
    default_value: false
    optional: true

  - id: zerotier_gateway_mode
    type: string
    name: "Gateway Mode"
    description: "Gateway mode (inbound, outbound, or both)"
    default_value: "inbound"
    optional: true

