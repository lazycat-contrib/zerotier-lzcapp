<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZeroTier</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #1a1a2e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #e0e0e0;
    }
    .container {
      text-align: center;
      max-width: 560px;
      padding: 40px 24px;
    }
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 32px;
    }
    .logo {
      width: 56px;
      height: 56px;
      background: #ffb441;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 900;
      color: #1a1a2e;
    }
    h1 {
      font-size: 42px;
      font-weight: 700;
      color: #ffb441;
      letter-spacing: -1px;
    }
    .usage {
      text-align: left;
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 24px 28px;
      line-height: 1.8;
    }
    .usage h2 {
      font-size: 16px;
      color: #ffb441;
      margin-bottom: 14px;
      font-weight: 600;
    }
    .usage ol {
      padding-left: 20px;
      color: #b0b0b0;
      font-size: 14px;
    }
    .usage a { color: #ffb441; text-decoration: none; }
    .usage a:hover { text-decoration: underline; }
    .lang-switch {
      position: fixed;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 4px;
    }
    .lang-switch button {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.15);
      color: #888;
      padding: 4px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }
    .lang-switch button.active {
      color: #ffb441;
      border-color: #ffb441;
    }
    .lang-switch button:hover { border-color: #ffb441; color: #ffb441; }
  </style>
</head>
<body>
  <div class="lang-switch">
    <button id="btn-zh" onclick="switchLang('zh')">中文</button>
    <button id="btn-en" onclick="switchLang('en')">EN</button>
  </div>

  <div class="container">
    <div class="brand">
      <div class="logo">ZT</div>
      <h1>ZeroTier</h1>
    </div>
    <div class="usage">
      <p data-i18n="guide"></p>
    </div>
  </div>

  <script>
    const msgs = {
      zh: {
        guide: '在部署向导中填写 ZeroTier Network ID，启动后即可加入网络。<br>详细使用教程请参考 <a href="https://docs.zerotier.com/quickstart/" target="_blank">ZeroTier 快速入门</a>',
      },
      en: {
        guide: 'Fill in your ZeroTier Network ID in the setup wizard and start the app to join the network.<br>See the <a href="https://docs.zerotier.com/quickstart/" target="_blank">ZeroTier Quickstart</a> for detailed instructions.',
      }
    };

    function applyLang(lang) {
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (msgs[lang] && msgs[lang][key]) {
          el.innerHTML = msgs[lang][key];
        }
      });
      document.querySelectorAll('.lang-switch button').forEach(b => {
        b.classList.toggle('active', b.id === 'btn-' + lang);
      });
      localStorage.setItem('zt-lang', lang);
    }

    function switchLang(lang) { applyLang(lang); }

    const saved = localStorage.getItem('zt-lang');
    const browserLang = (navigator.language || '').startsWith('zh') ? 'zh' : 'en';
    applyLang(saved || browserLang);
  </script>
</body>
</html>
